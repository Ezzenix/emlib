modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "https://github.com/Ezzenix/emlib/issues"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Ezzenix"
description = '''
${description}
'''
logoFile = "icon.png"
logoBlur = false

[[mixins]]
config = "${id}.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraftVersion},)"
ordering = "NONE"
side = "CLIENT"
